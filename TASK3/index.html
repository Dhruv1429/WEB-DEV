<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <div class="registration-card">
            
            <div class="card-header">
                <h2>Secure Your Spot</h2>
                <p>Join us for the upcoming community event.</p>
            </div>
            
            <form action="#">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="e.g. XYZ" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="e.g. XYZ@company.com" required>
                </div>

                <div class="form-group full-width">
                    <label for="event-type">Which session are you attending?</label>
                    <select id="event-type" name="event-type">
                        <option value="" disabled selected>Select an event type...</option>
                        <option value="workshop">Tech Workshop (Morning)</option>
                        <option value="networking">Networking Lunch</option>
                        <option value="panel">Expert Panel (Evening)</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>Dietary Requirements</label>
                    <div class="checkbox-wrapper">
                        <label class="custom-checkbox">
                            <input type="checkbox" name="diet" value="vegetarian">
                            <span>Vegetarian</span>
                        </label>
                        <label class="custom-checkbox">
                            <input type="checkbox" name="diet" value="vegan">
                            <span>Vegan</span>
                        </label>
                        <label class="custom-checkbox">
                            <input type="checkbox" name="diet" value="gf">
                            <span>Gluten Free</span>
                        </label>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="comments">Notes</label>
                    <textarea id="comments" name="comments" placeholder="Let us know if you have any questions..."></textarea>
                </div>

                <button type="submit" class="submit-btn full-width">Confirm Registration</button>
            </form>
        </div>
    </div>

</body>
</html>
