<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Mood Greeter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>👋 Check In</h2>
        
        <input type="text" id="userName" placeholder="What is your name?">
        
        <select id="userMood">
            <option value="" disabled selected>How are you feeling?</option>
            <option value="happy">Happy</option>
            <option value="sad">Sad / Down</option>
            <option value="energetic">Energetic</option>
            <option value="tired">Tired</option>
        </select>

        <button onclick="generateGreeting()">Get Greeting</button>

        <div id="greeting-result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
